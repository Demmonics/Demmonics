name: Generate Contribution Snake and Heatmap

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Generate 2026 Heatmap SVG
        run: |
          python generate_heatmap.py

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Update 2026 Animated Snake SVG
        run: |
          python make_2026_snake.py

      - name: Commit and Push SVGs to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribution-heatmap-2026.svg github-contribution-grid-snake-2026.svg
          if git commit -m "Auto-update 2026 heatmap and snake animation"; then
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


